# =====================================================================
#  db.properties – settings for DBConnection.java (copied to WEB-INF/classes)
#  Change these values to match YOUR MySQL installation.
#  Each value can also be overridden by an environment variable:
#     SP_DB_URL, SP_DB_USER, SP_DB_PASSWORD, SP_UPLOAD_BASE_DIR
# =====================================================================

# JDBC driver class from MySQL Connector/J 8.x
db.driver=com.mysql.cj.jdbc.Driver

# Same database as the PHP admin panel
db.url=jdbc:mysql://localhost:3306/student_portal?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&characterEncoding=UTF-8

# XAMPP default: user root with an EMPTY password
db.user=root
db.password=

# Folder of the PHP admin panel that CONTAINS the uploads/ directory.
# The servlet reads files from <upload.base.dir>/uploads/profiles and /documents.
# Use forward slashes even on Windows.
upload.base.dir=C:/xampp/htdocs/student-portal/Question2_PHP
